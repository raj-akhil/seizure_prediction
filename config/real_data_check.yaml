# Small real-data engineering check. NOT a 30-minute forecasting validation.
# Four complete recordings; no raw copies. Window=5s, stride=60s, target=5-10min.
dataset:
  raw_dir: data/raw
  interim_dir: outputs/real_data_check/interim
  subjects:
  - sub-122
  - sub-123
  - sub-124
  - sub-125
  runs: null
  recordings:
  - sub-122_ses-01_task-szMonitoring_run-10
  - sub-123_ses-01_task-szMonitoring_run-81
  - sub-124_ses-01_task-szMonitoring_run-47
  - sub-125_ses-01_task-szMonitoring_run-21
sensors:
  enabled:
  - eeg
  - ecg
  - emg
  - mov
  channels:
    eeg: null
    ecg: null
    emg: null
    mov: null
  missing_policy: error
alignment:
  mode: published_run_relative
  evidence: SeizeIT2 publisher alignment assumed within runs; inconsistent EDF absolute
    dates. Not independently signal-verified.
  offsets_sec:
    eeg: 0
    ecg: 0
    emg: 0
    mov: 0
  run_offsets_sec: {}
  duration_tolerance_sec: 0.1
preprocessing:
  output_sampling_rate: 256
  window_sec: 5
  stride_sec: 60
  context_sec: 0
  filter_warmup_sec: 10
  filters:
    eeg:
      low_hz: 0.5
      high_hz: 40
      order: 4
    ecg:
      low_hz: 0.5
      high_hz: 40
      order: 4
    emg:
      low_hz: 10
      high_hz: 100
      order: 4
    mov:
      low_hz: null
      high_hz: null
      order: 4
  quality:
    reject_flat_modalities:
    - eeg
    - ecg
    - emg
    flat_peak_to_peak: 0.0
labels:
  enabled: true
  annotation_coverage: whole_run
  seizure_prefixes:
  - sz
  minimum_warning_min: 5
  occurrence_period_min: 5
  postictal_exclusion_min: 30
  background_separation_min: 0
  excluded_event_types:
  - impd
execution:
  fail_fast: true
features:
  enabled: true
  batch_windows: 128
  families:
    eeg:
    - time
    - spectral
    - hjorth
    - entropy
    - correlation
    ecg:
    - time
    - spectral
    - cardiac
    emg:
    - time
    - spectral
    - muscle
    mov:
    - time
    - spectral
    - motion
  welch_segment_sec: 2
  bands:
    eeg:
      delta:
      - 0.5
      - 4
      theta:
      - 4
      - 8
      alpha:
      - 8
      - 13
      beta:
      - 13
      - 30
      low_gamma:
      - 30
      - 40
    ecg:
      low:
      - 0.5
      - 5
      qrs:
      - 5
      - 20
      high:
      - 20
      - 40
    emg:
      low:
      - 10
      - 30
      mid:
      - 30
      - 60
      high:
      - 60
      - 100
    mov:
      slow:
      - 0
      - 1
      activity:
      - 1
      - 3
      fast:
      - 3
      - 10
  ecg:
    history_sec: 60
    min_hrv_sec: 60
    min_rr_count: 20
    rr_range_sec:
    - 0.3
    - 2.0
    max_rejected_fraction: 0.2
    detector_band_hz:
    - 5
    - 20
    detector_order: 2
    integration_sec: 0.12
    refractory_sec: 0.25
    threshold_mad: 3.0
  temporal:
    history_sec: []
training:
  seed: 42
  output_dir: outputs/real_data_check/training
  splits:
    train:
    - sub-122
    - sub-125
    validation:
    - sub-123
    test:
    - sub-124
  inner_folds: 2
  min_positive_events_per_partition: 1
  n_jobs: 1
  native_threads: 1
  cv_verbose: 2
  max_feature_matrix_gib: 4
  selection:
    method: anova
    k: 10
    max_missing_fraction: 0.5
    correlation_threshold: 0.98
    add_missing_indicators: true
  selection_grid:
    k:
    - 10
  models:
    logistic:
      C:
      - 1.0
      max_iter:
      - 1000
      class_weight:
      - balanced
    random_forest:
      n_estimators:
      - 12
      max_depth:
      - 4
      min_samples_leaf:
      - 2
      class_weight:
      - balanced
    hist_gradient_boosting:
      max_iter:
      - 12
      max_leaf_nodes:
      - 7
      min_samples_leaf:
      - 5
      class_weight:
      - balanced
  scoring: average_precision
  alarms:
    thresholds:
    - 0.1
    - 0.3
    - 0.5
    - 0.7
    - 0.9
    - 0.99
    - 1.0
    consecutive_windows: 1
    refractory_sec: 2400
    max_false_alarms_per_day: 2
validation:
  calibration_bins: 10
  bootstrap_replicates: 0
  confidence_level: 0.95
  min_subjects_for_ci: 5
  seed: 42
  plots: true
