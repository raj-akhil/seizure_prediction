dataset:
  raw_dir: "./data/raw"
  interim_dir: "./audit/runs/cli_prepared"
  seed: 42

hardware:
  max_physical_channels: 4
  # Set to exact channel labels in your EDFs, or null to load all channels
  target_bte_channels: ["BTEleft SD", "CROSStop SD"]

preictal_definition:
  preictal_window_min: 30       # Preictal duration before seizure onset
  sph_window_min: 5            # Seizure prediction horizon safety margin
  exclude_ictal: true          # Exclude active seizure periods

preprocessing:
  sampling_rate: 256            # Common target frequency across all modalities
  apply_filter: false           # Set true only if applying 1.0-25.0 Hz bandpass
  l_freq: 1.0
  h_freq: 25.0
  window_sec: 5.0               # Resampling/slicing time grid in seconds
  feature_types: ["raw"]        # Keeps un-engineered raw signals

labels:
  target_columns: ["eventType", "lateralization", "localization", "vigilance"]
  mapping:
    eventType:
      bckg: 0
      impd: 1
      sz: 2
      sz_foc: 3
      sz_foc_a: 4
      sz_foc_a_m: 5
